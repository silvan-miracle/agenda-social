name: Publicar la web

# La web (index.html) la envía el robot «Actualizar la web» del repositorio privado agenda-social-datos.
# Aquí solo se publica en GitHub Pages cada vez que cambia algo en este repositorio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Preparar la web (solo lo público)
        run: |
          mkdir _site
          cp index.html _site/
          for f in app.js data.json promedio.json; do [ -f "$f" ] && cp "$f" _site/ || true; done
          # Resultados por sección censal (los copia aquí el robot de agenda-social-datos)
          [ -d secciones ] && cp -r secciones _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
